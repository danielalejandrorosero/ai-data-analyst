[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Daniel Alejandro Rosero Ortiz", email = "alexandernino0308@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.19.1",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "openpyxl>=3.1.5",
    "pgvector>=0.5.0",
    "polars>=1.43.2",
    "pydantic-ai>=2.31.0",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.13.0",
    "python-multipart>=0.0.32",
    "redis>=8.1.0",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.52.3",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
module-root = ""

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.3",
]
