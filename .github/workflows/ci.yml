name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend-lint:
    name: Backend lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      # El workspace de uv vive en la raiz del repo (pyproject.toml raiz
      # define [tool.uv.workspace] con members = ["backend", "workers"]) -
      # uv sync se corre desde ahi, no desde backend/.
      - name: Sync workspace (backend + workers)
        run: uv sync --frozen

      - name: Ruff check (backend/app + workers/tasks)
        run: uv run ruff check backend/app workers/tasks

  backend-test:
    name: Backend tests (integracion, Postgres + Redis reales)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_data_analyst_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Sync workspace (backend + workers)
        run: uv sync --frozen

      # backend/tests/conftest.py (fixture _prepare_database) crea la
      # extension pgvector y el schema "datasets" + grants por sesion de
      # tests, pero asume que el ROL agent_readonly ya existe (RF-030:
      # credenciales de solo lectura dedicadas para el canal del agente,
      # nunca las de la plataforma). En docker-compose eso lo resuelve el
      # init script de Postgres (infrastructure/postgres/init/002-agent-
      # readonly-role.sh) al arrancar el contenedor con un volume montado.
      # Los "services:" de este job arrancan ANTES del checkout, asi que
      # no hay forma de montarles ese init script - replicamos el mismo
      # SQL a mano, una vez, contra el Postgres del job.
      - name: Apply agent_readonly role + grants (mirror of infrastructure/postgres/init/002-agent-readonly-role.sh)
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -p 5432 -U postgres -d ai_data_analyst_test -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
             IF NOT EXISTS (SELECT FROM pg_catalog.pg_roles WHERE rolname = 'agent_readonly') THEN
                CREATE ROLE agent_readonly WITH LOGIN PASSWORD 'changeme_agent_readonly';
             END IF;
          END
          $$;

          CREATE SCHEMA IF NOT EXISTS datasets;

          REVOKE ALL ON SCHEMA public FROM agent_readonly;
          GRANT USAGE ON SCHEMA datasets TO agent_readonly;
          GRANT SELECT ON ALL TABLES IN SCHEMA datasets TO agent_readonly;
          ALTER DEFAULT PRIVILEGES IN SCHEMA datasets GRANT SELECT ON TABLES TO agent_readonly;
          SQL

      - name: Run backend integration tests
        run: cd backend && uv run pytest tests/ -q

  frontend:
    name: Frontend (lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  docker-build:
    name: Docker build (api, worker, frontend)
    runs-on: ubuntu-latest
    needs: [backend-lint, backend-test, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build api image
        run: docker build -f infrastructure/docker/backend.Dockerfile -t ai-data-analyst-api:ci .

      - name: Build worker image
        run: docker build -f infrastructure/docker/worker.Dockerfile -t ai-data-analyst-worker:ci .

      - name: Build frontend image
        run: docker build -f infrastructure/docker/frontend.Dockerfile -t ai-data-analyst-frontend:ci .
